name: Rust Tests

# Runs the Rust suite on macOS and Linux for every change that can affect it.
#
# WHY THIS EXISTS
#   Until this workflow, `cargo test` ran off Windows only inside release.yml,
#   so the first run of platform-conditional Rust code on Unix happened after a
#   release was tagged. v1.0.8 paid for that: a Windows-drive-path test failed
#   on macOS (#54) and a `kill -TERM -pgid` form signalled the caller's own
#   process group and shut down the Linux runner (#55), both found at release
#   time. Windows is the development platform and runs the suite locally
#   (verification-policy Rule 1), so this job covers the two it cannot.
#
# The steps mirror release.yml's proven sequence; keep them in step with it.
#
# THE REQUIRED CHECK
#   `main`'s branch protection requires `cargo test (required)` (the last job
#   here) as well as the architecture guard. A required check that never
#   reports blocks a pull request forever, so this workflow runs on EVERY pull
#   request: the `changes` job decides whether the suite has to run, and
#   `cargo test (required)` reports the outcome either way. The per-platform
#   jobs cannot be the required checks themselves, because a matrix job that
#   is skipped reports one check under its unexpanded name.

on:
  workflow_dispatch:
  # No path filter on pull requests; see THE REQUIRED CHECK above.
  pull_request:
  push:
    branches:
      - main
    # The inputs that can affect the Rust suite. The `changes` job repeats
    # this list as shell patterns; keep the two in step.
    paths:
      - "src-tauri/**"
      # Files the crate compiles in from outside src-tauri (include_str!).
      - "src/scaffold/recipes.json"
      - "resources/language-server-registry.json"
      - "test/fixtures/scaffold-plans/**"
      # Runtime staging that tauri-build validates.
      - "scripts/bundle-node.mjs"
      - "scripts/bundle-servers.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/rust-tests.yml"

permissions:
  contents: read

concurrency:
  group: rust-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: rust inputs changed?
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
    steps:
      - name: Compare the pull request's files with the Rust inputs
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # A push to main is already filtered by its trigger; a manual run tests everything.
          if [ "$EVENT" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Both names of a renamed file count. A failed listing fails this job,
          # and with it the required check (fail closed).
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)')
          rust=false
          # The listing stops at 3000 files; past that, assume the worst.
          if [ "$(printf '%s\n' "$files" | grep -c .)" -ge 3000 ]; then rust=true; fi
          # Same list as the push trigger's `paths` above.
          while IFS= read -r f; do
            case "$f" in
              src-tauri/*|src/scaffold/recipes.json|resources/language-server-registry.json|\
              test/fixtures/scaffold-plans/*|scripts/bundle-node.mjs|scripts/bundle-servers.mjs|\
              package.json|package-lock.json|.github/workflows/rust-tests.yml)
                rust=true ;;
            esac
          done <<< "$files"
          echo "Rust inputs changed: $rust"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

  test:
    name: cargo test (${{ matrix.label }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # A healthy run takes minutes; a hung step (2026-10-01: apt on the Linux
    # runner) would otherwise hold the required check for six hours.
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Same images as release.yml, so a green PR predicts a green release.
          - os: ubuntu-22.04
            label: linux-x86_64
          - os: macos-14
            label: macos-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      # Tauri v2's Debian/Ubuntu prerequisites (see release.yml for the
      # libappindicator3-dev conflict). patchelf is bundling-only, so it is left out.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-07
        with:
          toolchain: stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      # tauri-build validates the resource paths in tauri.conf.json even under
      # `cargo test`, so the runtimes must be staged first (see release.yml).
      - name: Stage bundled runtimes
        run: |
          npm run bundle:node
          npm run bundle:servers

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

  # The check `main`'s branch protection requires. It passes when the suite
  # passed on every platform, or when no Rust input changed; anything else
  # fails it, including a cancelled or timed-out platform job. It runs under
  # `always()`, not `!cancelled()`, on purpose: a SKIPPED required check counts
  # as passing, so a cancelled run must still reach this job and fail here.
  required:
    name: cargo test (required)
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the suite's outcome
        env:
          CHANGES: ${{ needs.changes.result }}
          RUST: ${{ needs.changes.outputs.rust }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "changes=$CHANGES rust=$RUST test=$TEST"
          if [ "$CHANGES" != "success" ]; then
            echo "::error::Could not tell whether a Rust input changed."
            exit 1
          fi
          if [ "$RUST" = "true" ]; then
            if [ "$TEST" != "success" ]; then
              echo "::error::cargo test did not pass on every platform ($TEST)."
              exit 1
            fi
            echo "cargo test passed on every platform."
          else
            if [ "$TEST" != "skipped" ]; then
              echo "::error::No Rust input changed, but the suite reported $TEST."
              exit 1
            fi
            echo "No Rust input changed; the suite was not needed."
          fi
