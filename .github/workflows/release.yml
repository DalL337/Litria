name: Release

# Builds installers for every supported platform and attaches them to a
# release. Public repos get GitHub-hosted runners free, which is what makes a
# macOS build possible at all -- see ADR-010 ("Expand the existing single-runner
# CI to a platform matrix when macOS/Linux development begins").
#
# WHAT THIS DOES AND DOES NOT PROVE
#   Proves: the tree compiles on each platform, the Rust suite passes there,
#           and a bundle can be produced.
#   Does NOT prove: that the app launches or behaves correctly. No runner
#           clicks a button. macOS in particular carries an unverified
#           high-severity item (ADR-010 section 9: maximize-button freeze on an
#           undecorated window). Label non-Windows artifacts accordingly until
#           a human has run them.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to BUILD (tag, branch or SHA). e.g. v1.0.0 or main"
        required: true
        type: string
      release_tag:
        description: "Release to ATTACH artifacts to. e.g. v1.0.0"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # One platform failing must not deny the others their artifacts.
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04, not latest: the AppImage links against the runner's glibc,
          # so building on an older base widens the range of distros it runs on.
          - os: ubuntu-22.04
            label: linux-x86_64
          - os: macos-14
            label: macos-aarch64
          # Intel Mac is CROSS-COMPILED from the Apple Silicon runner rather
          # than built on a macos-13 box. GitHub is retiring the Intel runner
          # pool through 2026, and a macos-13 job here queued 59 minutes
          # without ever being allocated one (0 steps run). Apple's toolchain
          # targets both architectures and bundle-node.mjs already honours
          # TAURI_TARGET_TRIPLE, so the cross build needs no scarce hardware.
          - os: macos-14
            label: macos-x86_64
            rust_target: x86_64-apple-darwin
          - os: windows-latest
            label: windows-x86_64

    steps:
      # Build ref and release tag are separate on purpose: a published tag can
      # need artifacts built from a later commit (e.g. a CI-only or test-only
      # fix that does not change shipped behaviour). On a tag push both are the
      # same thing.
      - name: Checkout ${{ inputs.ref || github.ref_name }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Tauri v2's documented Debian/Ubuntu prerequisites, plus patchelf for
      # AppImage. Do NOT add libappindicator3-dev alongside the ayatana package
      # -- they declare a hard Conflicts and apt fails with "held broken
      # packages" (cost this workflow its first Linux run).
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            patchelf \
            curl \
            wget \
            file

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add cross-compilation target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Architecture guards
        run: npm run check:architecture

      - name: JS domain tests
        run: npm run test:domains

      # Staging MUST precede cargo test: tauri-build runs as this crate's build
      # script and validates the resource paths declared in tauri.conf.json, so
      # `cargo test` fails with "failed to run custom build command" when the
      # runtimes are not staged yet. Windows trips it first because
      # tauri.windows.conf.json names explicit FILES (conpty.dll,
      # OpenConsole.exe) rather than directories.
      #
      # ConPTY is a Windows-only sideload, so only that platform runs the
      # combined script; bundle-conpty.mjs has no platform guard of its own.
      - name: Stage bundled runtimes (Windows)
        if: runner.os == 'Windows'
        run: npm run bundle

      # TAURI_TARGET_TRIPLE makes bundle-node.mjs fetch Node for the TARGET
      # architecture instead of the runner's -- otherwise the Intel build would
      # ship an arm64 Node. Unset on native jobs, where the script falls back to
      # platform detection (an empty env var is falsy in its check).
      - name: Stage bundled runtimes (macOS / Linux)
        if: runner.os != 'Windows'
        env:
          TAURI_TARGET_TRIPLE: ${{ matrix.rust_target }}
        run: |
          npm run bundle:node
          npm run bundle:servers

      # First time this suite has ever run outside Windows. The Rust backend
      # carries platform-conditional code (shell selection, process cleanup,
      # filesystem sync) that has only been exercised on one OS until now.
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build installers
        shell: bash
        run: |
          if [ -n "${{ matrix.rust_target }}" ]; then
            npm run tauri -- build --target "${{ matrix.rust_target }}"
          else
            npm run tauri -- build
          fi

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist-artifacts
          # A --target build lands in target/<triple>/release/bundle/; a native
          # one in target/release/bundle/. Match both rather than hardcoding.
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \
               -o -name '*.rpm' -o -name '*-setup.exe' -o -name '*.msi' \) \
            -exec cp {} dist-artifacts/ \;
          echo "--- collected ---"
          ls -la dist-artifacts/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: litria-${{ matrix.label }}
          path: dist-artifacts/*
          if-no-files-found: error

      - name: Attach to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.release_tag || github.ref_name }}" \
            dist-artifacts/* --clobber --repo "${{ github.repository }}"
