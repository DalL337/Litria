name: Architecture Guard

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Architecture checks
        run: npm run check:architecture

      - name: Domain tests
        run: npm run test:domains

      - name: Build
        run: npm run build
